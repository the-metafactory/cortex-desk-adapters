name: P_DESK_MAIL_TRIAGE
description: Researches one unread mail for the Cortex Desk with Cortex's prompt and checks the answer.
actions:
  - research:
      name: triage
      model: triage
      tools: [A_MAIL_SEARCH, A_MAIL_READ, A_CALENDAR_EVENTS, A_NOTES_SEARCH]
      max_rounds: 6
      timeout_ms: 60000
      temperature: 0
      max_tokens: 4000
      result_chars: 2500
      collect: triage_text
      system: "{request.messages.system}"
      prompt: "{request.messages.user}"
  - A_DESK_TRIAGE_CHECK
